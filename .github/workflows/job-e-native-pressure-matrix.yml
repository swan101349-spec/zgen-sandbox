name: JOB-E C4 | native wet pen pressure response matrix
on:
  push:
    branches: [qa/job-e-native-pressure-response-20261126]
permissions:
  contents: read
jobs:
  per-head-pressure:
    strategy:
      fail-fast: false
      matrix:
        head: [round, mop, flat, rigger, sponge]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    name: Native C4 pointer pressure ${{ matrix.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and zero painter mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only aa28f789a003ff4043932dfcf9a0262c1039f228 HEAD >/tmp/zgen-job-e-pressure
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/zgen-job-e-pressure').read_text().splitlines())
          expected={'tests/job-e-native-pen-pressure-matrix.cjs',
                    '.github/workflows/job-e-native-pressure-matrix.yml'}
          assert changed==expected,(changed,expected)
          print('ZGEN_JOB_E_PRESSURE_QA_SOURCE_IMMUTABILITY_PASS',sorted(changed))
          PY
          git diff --quiet aa28f789a003ff4043932dfcf9a0262c1039f228 HEAD -- studio-recovery-20261124/
          node --check tests/job-e-native-pen-pressure-matrix.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Simulated pressure and REAL native DOM pointer/pigment assertions
        env:
          ZGEN_BRUSH: ${{ matrix.head }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-e-pressure-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-e-native-pen-pressure-matrix.cjs
