name: JOB-H C3 negative phase matrix (no release)
on:
  push:
    branches: [qa/job-h-c3-negative-matrix-20261126]
permissions:
  contents: read
jobs:
  c3-two-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-head QA scope and zero painter mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only 8f503643b2ec3fe61b794c9305564d53e2ee0bb1 HEAD > /tmp/job-h-negative-changed
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/job-h-negative-changed').read_text().splitlines())
          allowed={'tests/job-h-c3-negative-matrix.cjs','.github/workflows/job-h-c3-negative-matrix.yml'}
          assert changed==allowed,(changed,allowed)
          print('ZGEN_JOB_H_C3_REVIEWER_SCOPE_IMMUTABILITY_PASS',sorted(changed))
          PY
          git diff --quiet 8f503643b2ec3fe61b794c9305564d53e2ee0bb1 HEAD -- studio-recovery-20261124/
          node --check tests/job-h-c3-negative-matrix.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Actual STOP wet SETTLE FIX negative matrix at 390 and 800
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/job-h-c3-negative-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-h-c3-negative-matrix.cjs
