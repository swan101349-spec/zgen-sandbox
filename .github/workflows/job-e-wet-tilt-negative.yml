name: JOB-E C4 | negative tilt forwarding test (NOT a tilt PASS)
on:
  push:
    branches: [qa/job-e-c4-stylus-tilt-forwarding-negative-20261126]
permissions:
  contents: read
jobs:
  tilt-fail-closed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and QA-only two-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only aa28f789a003ff4043932dfcf9a0262c1039f228 HEAD >/tmp/zgen-tilt-neg-diff
          python3 - <<'PY'
          from pathlib import Path
          names=set(Path('/tmp/zgen-tilt-neg-diff').read_text().splitlines())
          expected={'tests/job-e-wet-tilt-negative-bridge.cjs',
                    '.github/workflows/job-e-wet-tilt-negative.yml'}
          assert names==expected,(names,expected)
          print('ZGEN_JOB_E_TILT_NEGATIVE_QA_SCOPE_PASS',sorted(names))
          PY
          git diff --quiet aa28f789a003ff4043932dfcf9a0262c1039f228 HEAD -- studio-recovery-20261124/
          node --check tests/job-e-wet-tilt-negative-bridge.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Real DOM tilt pen input vs C4 scripted wet queue, negative witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-tilt-negative-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-e-wet-tilt-negative-bridge.cjs
