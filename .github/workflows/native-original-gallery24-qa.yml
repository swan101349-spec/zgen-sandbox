name: Original Rascal 24 | native Three-Shell gallery integration
on:
  push:
    branches: ['integration/three-shell-original-gallery24-20261124']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original wet/graphite paint and private original artist PNGs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --check f71bfc095b89771b3c46d63fe248f3bab538083f HEAD
          # Exact parent-byte guard below replaces the earlier packed-only guards.
          # These first two would reject an intentional additive HTML script loader.
          node tests/native-original-gallery24-source-check.cjs
          node --check studio-recovery-20261124/original-artwork-gallery.js
          node --check tests/native-original-gallery24-browser-check.cjs
      - name: Install test-only browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Synthetic 24-image gallery through real importer, Undo/Redo, reload, both screens
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-gallery24-staging.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/native-original-gallery24-browser-check.cjs
