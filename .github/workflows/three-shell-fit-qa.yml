name: ZGen three-shell auto-fit QA
on:
  pull_request:
    paths:
      - 'three-shell.js'
      - 'three-shell.css'
      - 'bounded-fill.js'
      - 'bounded-fill.css'
      - 'shell-v2.html'
      - 'tests/bounded-fill-browser-check.cjs'
      - 'tests/bounded-fill-source-integrity.cjs'
      - 'tests/three-shell-fit-check.cjs'
      - 'tests/three-shell-browser-check.cjs'
      - '.github/workflows/three-shell-fit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shell JS and fit contract without touching paint engine
        run: |
          node --check three-shell.js
          node --check bounded-fill.js
          node --check tests/bounded-fill-browser-check.cjs
          node tests/bounded-fill-source-integrity.cjs
          node tests/three-shell-fit-check.cjs
          node --check tests/three-shell-browser-check.cjs
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser paper fit, overlays and pixel continuity
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . > /tmp/zgen-local.log 2>&1 &
          node tests/three-shell-browser-check.cjs
          node tests/bounded-fill-browser-check.cjs
      - name: Archive five viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgen-three-shell-fit-qa
          path: three-shell-browser-qa/
          if-no-files-found: ignore
