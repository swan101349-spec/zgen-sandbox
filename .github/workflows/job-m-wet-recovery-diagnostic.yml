name: JOB-M C2 | Disposable post-FIX artwork recovery QA
on:
  push:
    branches: [qa/job-m-wet-recovery-diagnostic-20261126]
permissions:
  contents: read
jobs:
  c2-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source/head/no painter mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only 8f503643b2ec3fe61b794c9305564d53e2ee0bb1 HEAD >/tmp/changed-job-m
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed-job-m').read_text().splitlines())
          allowed={'tests/job-m-wet-recovery-diagnostic.cjs','.github/workflows/job-m-wet-recovery-diagnostic.yml'}
          assert changed==allowed,(changed,allowed)
          print('ZGEN_JOB_M_DIAGNOSTIC_SOURCE_IMMUTABILITY_PASS',sorted(changed))
          PY
          node --check tests/job-m-wet-recovery-diagnostic.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Native wet auto-checkpoint before and after FIX, then explicit safe reload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-job-m-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-m-wet-recovery-diagnostic.cjs
