name: JOB-M C2 | native legacy Save Open negative acceptance
on:
  push:
    branches: [qa/job-m-legacy-save-open-contract-20261126]
permissions:
  contents: read
jobs:
  legacy-project-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and untouched painting/recovery sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only dc1b6dd9d540f39f40a266db84e8525d12203c81 HEAD >/tmp/changed-job-m-v2
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed-job-m-v2').read_text().splitlines())
          expected={'tests/job-m-legacy-save-open-contract.cjs','.github/workflows/job-m-legacy-save-open-contract.yml'}
          assert changed==expected,(changed,expected)
          print('ZGEN_JOB_M_LEGACY_QA_SOURCE_IMMUTABILITY_PASS',sorted(changed))
          PY
          node --check tests/job-m-legacy-save-open-contract.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Native Save Project v2 dry export and FIX-wet Save/Open refusals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/job-m-v2-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-m-legacy-save-open-contract.cjs
