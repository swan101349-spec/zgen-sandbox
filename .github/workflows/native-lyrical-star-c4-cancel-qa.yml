name: Native Lyrical ★ | P0 C4 cancel, two-finger and redo safety
on:
  push:
    branches: ['integration/lyrical-star-c4-cancel-qa-20261125']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lyrical-star-c4-cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact HEAD and untouched original painter, gallery and recovery
        shell: bash
        run: |
          set -euo pipefail
          base=f7c620875de90d14b55cf84434f38f8a518998af
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --check "$base" HEAD
          while IFS= read -r file; do
            case "$file" in
              tests/native-lyrical-star-c4-cancel-browser-check.cjs|.github/workflows/native-lyrical-star-c4-cancel-qa.yml) ;;
              *) echo "UNEXPECTED_PROTECTED_FILE_CHANGE: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          git diff --quiet "$base" HEAD -- studio-recovery-20261124/index.html
          git diff --quiet "$base" HEAD -- studio-recovery-20261124/artwork-survival.js
          git diff --quiet "$base" HEAD -- studio-recovery-20261124/original-artwork-gallery.js
          git diff --quiet "$base" HEAD -- studio-recovery-20261124/assets
          node --check studio-recovery-20261124/lyrical-pencil-one.js
          node --check studio-recovery-20261124/three-shell.js
          node --check tests/native-lyrical-star-c4-cancel-browser-check.cjs
          echo ZGEN_C4_CANCEL_PROTECTED_SOURCE_PASS
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Native pen cancellation, real two-finger C4 rollback, all dry/★ regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-star-c4-cancel.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/native-lyrical-star-c4-cancel-browser-check.cjs
          node tests/native-lyrical-star-wet-c4-browser-check.cjs
          node tests/native-lyrical1-pressure-flare-browser-check.cjs
          node tests/native-lyrical-sketchy-harmony-browser-check.cjs
          node tests/native-scrub-dry-browser-check.cjs
          node tests/native-cross-dry-browser-check.cjs
          node tests/native-fabric-dry-browser-check.cjs
          node tests/native-cloth-dry-browser-check.cjs
