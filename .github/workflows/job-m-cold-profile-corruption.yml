name: JOB-MN C2 | cold-profile restart and corruption safety QA
on:
  push:
    branches: [qa/job-m-fresh-profile-corruption-20261126]
permissions:
  contents: read
jobs:
  cold-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA and zero product mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only dc1b6dd9d540f39f40a266db84e8525d12203c81 HEAD >/tmp/job-mn-changed
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/job-mn-changed').read_text().splitlines())
          allowed={'tests/job-m-cold-profile-corruption.cjs','.github/workflows/job-m-cold-profile-corruption.yml'}
          assert changed==allowed,(changed,allowed)
          print('ZGEN_JOB_MN_COLD_QA_SOURCE_IMMUTABILITY_PASS',sorted(changed))
          PY
          node --check tests/job-m-cold-profile-corruption.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Cold browser process restart, exact wet state and corruption fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-cold-profile-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-m-cold-profile-corruption.cjs
