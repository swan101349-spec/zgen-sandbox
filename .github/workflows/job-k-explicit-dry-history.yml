name: JOB-K C1 | manual Dry retains its own Undo and Redo
on:
  push:
    branches: [qa/job-k-explicit-dry-history-preserved-20261126]
permissions:
  contents: read
jobs:
  explicit-c4-dry-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA QA-only additions over original JOB-K repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only 32014935f4175b7f0130ad17366a707083f0b581 HEAD >/tmp/zgen-manual-dry-diff
          python3 - <<'PY'
          from pathlib import Path
          got=set(Path('/tmp/zgen-manual-dry-diff').read_text().splitlines())
          expected={'tests/job-k-explicit-dry-has-own-undo.cjs',
                    '.github/workflows/job-k-explicit-dry-history.yml'}
          assert got==expected,(got,expected)
          print('ZGEN_JOB_K_EXPLICIT_DRY_SOURCE_UNCHANGED_PASS',sorted(got))
          PY
          git diff --quiet 32014935f4175b7f0130ad17366a707083f0b581 HEAD -- studio-recovery-20261124/
          node --check tests/job-k-explicit-dry-has-own-undo.cjs
          node tests/job-k-auto-fix-one-undo-source-contract.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Manual pre-auto Dry and native five-wet-layer two-step Undo Redo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-job-k-manual-dry-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-k-explicit-dry-has-own-undo.cjs
