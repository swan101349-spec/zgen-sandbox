name: C4 20 wet strokes | deep Undo + save safety
on:
  push:
    branches: ['qa/c4-20-wet-history-stress-20261124']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-c4-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head, artist original source untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --check d3c7a55c91a4750ec7ecf7490fad1418344c77a6 HEAD
          git diff --exit-code d3c7a55c91a4750ec7ecf7490fad1418344c77a6 HEAD -- \
            studio-recovery-20261124/ index.html original-engine.html shell-v2.html
          node tests/native-tiled-history-source-check.cjs
          node --check tests/native-c4-20-wet-stress-browser-check.cjs
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test 20 original watercolor strokes with exact native Undo/Redo and IndexedDB
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-c4-stress.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/native-c4-20-wet-stress-browser-check.cjs
