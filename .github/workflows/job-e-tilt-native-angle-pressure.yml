name: JOB-E C4 | native Flat nib tilt angle and pressure regression QA
on:
  push:
    branches: [qa/job-e-tilt-angle-pressure-regression-20261126]
permissions:
  contents: read
jobs:
  actual-native-angle-and-pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and QA-only scope over guarded tilt repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only 946b742e38283e29db08d2d5d298ef11b524aa46 HEAD >/tmp/zgen-tilt-angle-diff
          python3 - <<'PY'
          from pathlib import Path
          files=set(Path('/tmp/zgen-tilt-angle-diff').read_text().splitlines())
          expected={
            'tests/job-e-tilt-native-flat-angle-pressure.cjs',
            '.github/workflows/job-e-tilt-native-angle-pressure.yml'
          }
          assert files==expected,(files,expected)
          print('ZGEN_JOB_E_TILT_ANGLE_QA_SOURCE_IMMUTABILITY_PASS',sorted(files))
          PY
          git diff --quiet 946b742e38283e29db08d2d5d298ef11b524aa46 HEAD -- studio-recovery-20261124/
          node --check tests/job-e-tilt-native-flat-angle-pressure.cjs
          node tests/job-e-c4-tilt-source-contract.cjs
      - name: Prepare disposable real Chromium GPU
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Actual native Flat nib orientation and neutral pressure scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-e-angle-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-e-tilt-native-flat-angle-pressure.cjs
