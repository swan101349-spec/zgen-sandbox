name: JOB-K C1 | one native wet stroke one Undo Redo after automatic FIX
on:
  push:
    branches: [repair/job-k-auto-fix-single-undo-20261126]
permissions:
  contents: read
jobs:
  auto-fix-one-history-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact head and bounded two-edit source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only 946b742e38283e29db08d2d5d298ef11b524aa46 HEAD >/tmp/zgen-job-k-one-undo-paths
          python3 - <<'PY'
          from pathlib import Path
          paths=set(Path('/tmp/zgen-job-k-one-undo-paths').read_text().splitlines())
          expected={
            'studio-recovery-20261124/index.html',
            'tests/job-k-auto-fix-one-undo-source-contract.cjs',
            'tests/job-k-one-wet-stroke-one-undo-redo.cjs',
            '.github/workflows/job-k-auto-fix-one-undo.yml'
          }
          assert paths==expected,(paths,expected)
          print('ZGEN_JOB_K_AUTO_FIX_SOURCE_SCOPE_PASS',sorted(paths))
          PY
          node --check tests/job-k-auto-fix-one-undo-source-contract.cjs
          node --check tests/job-k-one-wet-stroke-one-undo-redo.cjs
          node tests/job-k-auto-fix-one-undo-source-contract.cjs
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const s=fs.readFileSync('studio-recovery-20261124/index.html','utf8');
          const m=s.match(/atob\('([A-Za-z0-9+/=]+)'\)/);
          if(!m)throw Error('Original packed native source missing');
          new vm.Script(Buffer.from(m[1],'base64').toString('latin1'),
            {filename:'job-k-auto-fix-painter.js'});
          console.log('ZGEN_JOB_K_AUTOFIX_PACKED_JS_SYNTAX_PASS');
          JS
      - name: Prepare isolated Chromium C4 wet GPU
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: One original C1 Undo and Redo across tilted native wet FIX
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-job-k-auto-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-k-one-wet-stroke-one-undo-redo.cjs
