name: JOB-E C4 | Rigger crop anomaly repeated diagnostic, not acceptance
on:
  push:
    branches: [qa/job-e-rigger-bbox-repeat-diagnostic-20261126]
permissions:
  contents: read
jobs:
  repeat-rigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA and two QA-only files, original red unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only b86dac3c23a36eee9df2bea60c85b0baf70e9b0b HEAD >/tmp/zgen-e-rigger-diff
          python3 - <<'PY'
          from pathlib import Path
          changes=set(Path('/tmp/zgen-e-rigger-diff').read_text().splitlines())
          allowed={'tests/job-e-rigger-repeated-geometry-diagnostic.cjs',
                   '.github/workflows/job-e-rigger-repeated-geometry-diagnostic.yml'}
          assert changes==allowed,(changes,allowed)
          print('ZGEN_JOB_E_RIGGER_DIAGNOSTIC_SOURCE_SCOPE_PASS',sorted(changes))
          PY
          git diff --quiet b86dac3c23a36eee9df2bea60c85b0baf70e9b0b HEAD -- studio-recovery-20261124/
          node --check tests/job-e-rigger-repeated-geometry-diagnostic.cjs
      - name: Install disposable Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Repeat C4 Rigger size45 and size60, log actual pigmented bbox
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/zgen-e-rigger-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/studio-recovery-20261124/ >/dev/null && break || sleep 1
          done
          node tests/job-e-rigger-repeated-geometry-diagnostic.cjs
